name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-evaluate:
    name: Tests and evaluation baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile
        run: python -m compileall -q peopleops evals server.py mcp_server.py

      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v

      - name: Evaluation baseline (60 cases, must match committed report)
        run: |
          python - <<'PY'
          import json
          from evals.run import evaluate
          fresh = evaluate()
          committed = json.load(open("evals/latest_report.json"))
          print(f"{fresh['passed']}/{fresh['total']} passed ({fresh['pass_rate']}%)")
          h = fresh["holdout"]
          print(f"Held-out (reported, not gated): {h['passed']}/{h['total']} passed; misses {h['miss_types']}")
          assert fresh["failures"] == [], fresh["failures"]
          for key in ("total", "passed", "categories", "metrics", "holdout"):
              assert fresh[key] == committed[key], f"{key} drifted: regenerate evals/latest_report.json and commit it"
          PY

      - name: Model screen report (replayed from recorded results, when present)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from evals.compare import REPORT, compare, load_recorded
          if not REPORT.exists():
              print("No screen report committed yet; nothing to replay.")
              raise SystemExit(0)
          fresh, committed = compare(load_recorded()), json.loads(REPORT.read_text())
          assert fresh["screen"] == committed["screen"], "screen source drifted"
          # Check every set the committed run recorded. Sets added later (such as
          # boundary_regression) have no recordings until a live run includes them.
          for name, entry in committed["sets"].items():
              assert fresh["sets"][name] == entry, f"{name} drifted: rerun the Model screen evaluation workflow"
          print("Replayed screen results match the committed report.")
          PY
