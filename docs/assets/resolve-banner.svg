<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Resolve: PeopleOps Resolution Agent</title>
  <desc id="desc">A dark banner in the playbook's style, with a request moving through evidence to human approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b12"/>
      <stop offset="1" stop-color="#121827"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61ddec"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="820" y1="0" x2="1060" y2="0">
      <stop offset="0" stop-color="#61ddec"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <path d="M820 180H1060" stroke="url(#flow)" stroke-width="3" stroke-opacity=".6"/>
  <circle cx="820" cy="180" r="14" fill="#61ddec"/>
  <circle cx="930" cy="180" r="18" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="930" cy="180" r="7" fill="#a4aec2"/>
  <circle cx="1060" cy="180" r="42" fill="#8b7cff" fill-opacity=".28" filter="url(#glow)"/>
  <circle cx="1060" cy="180" r="30" fill="url(#signal)"/>
  <path d="M1047 180l9 9 17-19" fill="none" stroke="#070910" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="820" y="238" fill="#a4aec2" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" letter-spacing="1">REQUEST</text>
  <text x="930" y="238" fill="#a4aec2" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" letter-spacing="1">EVIDENCE</text>
  <text x="1060" y="238" fill="#a4aec2" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" letter-spacing="1">APPROVAL</text>
  <text x="64" y="72" fill="#a99fff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">INTAKE  /  EVIDENCE  /  HUMAN APPROVAL</text>
  <text x="64" y="160" fill="#f5f7fb" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="650" letter-spacing="-2">Resolve</text>
  <text x="66" y="214" fill="#f5f7fb" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-1">PeopleOps Resolution Agent</text>
  <text x="66" y="266" fill="#a4aec2" font-family="Inter, Arial, sans-serif" font-size="20">Governed HR case resolution, from request to approval</text>
  <rect x="66" y="300" width="258" height="3" rx="2" fill="url(#signal)"/>
</svg>
