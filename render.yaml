services:
  - type: web
    name: peopleops-resolution-agent
    runtime: python
    plan: free
    buildCommand: python3 -m unittest discover -s tests -v
    startCommand: python3 server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.8
